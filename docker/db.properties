# 컨테이너(docker compose) 전용 접속 설정.
# 빌드 시 Dockerfile이 이 파일을 src/main/resources/db.properties로 복사한다.
# 호스트명은 compose 서비스명(db, redis)을 사용한다.
db.url=jdbc:postgresql://db:5432/SecondheadServiceDB
db.user=postgres
db.password=990909

redis.host=redis
redis.port=6379

# 컨테이너 내부 업로드 폴더 (compose에서 named volume으로 영속화)
upload.dir=/data/upload
