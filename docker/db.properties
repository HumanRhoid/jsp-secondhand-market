# 컨테이너(docker compose) 전용 접속 설정.
# 빌드 시 Dockerfile이 이 파일을 src/main/resources/db.properties로 복사한다.
# 호스트명은 compose 서비스명(db, redis)을 사용한다.
db.url=jdbc:postgresql://db:5432/SecondheadServiceDB
db.user=postgres
db.password=990909

redis.host=redis
redis.port=6379

# 컨테이너 내부 업로드 폴더 (compose에서 named volume으로 영속화)
upload.dir=/data/upload

# ── 외부 API 연동 (키 발급 후 채우면 해당 기능 활성화) ──
# 카카오 개발자(https://developers.kakao.com) — 맵/로그인
kakao.js.key=YOUR_KAKAO_JAVASCRIPT_KEY
kakao.rest.key=YOUR_KAKAO_REST_API_KEY
# 네이버 개발자(https://developers.naver.com) — 네이버 로그인
naver.client.id=YOUR_NAVER_CLIENT_ID
naver.client.secret=YOUR_NAVER_CLIENT_SECRET
# 포트원(https://portone.io) — 결제. imp.code는 가맹점 식별코드(imp로 시작)
portone.imp.code=YOUR_IMP_CODE
portone.api.key=YOUR_PORTONE_API_KEY
portone.api.secret=YOUR_PORTONE_API_SECRET
# OAuth 콜백 베이스 URL
oauth.base.url=http://localhost:8080/secondhand
