<svg width="1560" height="620" viewBox="0 0 1560 620" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect id="canvas" x="0.5" y="0.5" width="1559" height="619" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- root -->
  <g id="root">
    <rect x="660" y="40" width="240" height="56" rx="12" fill="#000000"/>
    <text x="780" y="64" text-anchor="middle" font-family="'SF Pro Rounded', system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">중고거래 플랫폼</text>
    <text x="780" y="84" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="rgba(255,255,255,0.7)">secondhand market — IA</text>
  </g>

  <!-- connectors -->
  <g id="connectors" stroke="#d4d4d4">
    <line x1="780" y1="96"  x2="780"  y2="128"/>
    <line x1="120" y1="128" x2="1440" y2="128"/>
    <line x1="120"  y1="128" x2="120"  y2="160"/>
    <line x1="340"  y1="128" x2="340"  y2="160"/>
    <line x1="560"  y1="128" x2="560"  y2="160"/>
    <line x1="780"  y1="128" x2="780"  y2="160"/>
    <line x1="1000" y1="128" x2="1000" y2="160"/>
    <line x1="1220" y1="128" x2="1220" y2="160"/>
    <line x1="1440" y1="128" x2="1440" y2="160"/>
    <!-- branch spines -->
    <line x1="120"  y1="208" x2="120"  y2="262"/>
    <line x1="340"  y1="208" x2="340"  y2="486"/>
    <line x1="560"  y1="208" x2="560"  y2="486"/>
    <line x1="780"  y1="208" x2="780"  y2="374"/>
    <line x1="1000" y1="208" x2="1000" y2="374"/>
    <line x1="1220" y1="208" x2="1220" y2="374"/>
    <line x1="1440" y1="208" x2="1440" y2="430"/>
  </g>

  <!-- level-1 branches -->
  <g id="branches" font-size="15" font-weight="600">
    <rect x="20.5"   y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="120"  y="189" text-anchor="middle" fill="#000000">시작</text>
    <rect x="240.5"  y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="340"  y="189" text-anchor="middle" fill="#000000">인증</text>
    <rect x="460.5"  y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="560"  y="189" text-anchor="middle" fill="#000000">상품</text>
    <rect x="680.5"  y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="780"  y="189" text-anchor="middle" fill="#000000">주문 / 결제</text>
    <rect x="900.5"  y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="1000" y="189" text-anchor="middle" fill="#000000">장바구니</text>
    <rect x="1120.5" y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="1220" y="189" text-anchor="middle" fill="#000000">동네생활</text>
    <rect x="1340.5" y="160.5" width="199" height="47" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="1440" y="189" text-anchor="middle" fill="#000000">마이페이지</text>
  </g>

  <!-- leaves: 시작 -->
  <g id="leaves-home">
    <rect x="20.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="120" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">시작 페이지</text>
    <text x="120" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/</text>
  </g>

  <!-- leaves: 인증 -->
  <g id="leaves-auth">
    <rect x="240.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="340" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">로그인</text>
    <text x="340" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/login</text>
    <rect x="240.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="340" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">회원가입</text>
    <text x="340" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/join</text>
    <rect x="240.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="340" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">카카오 OAuth</text>
    <text x="340" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/auth/kakao</text>
    <rect x="240.5" y="408.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="340" y="426" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">네이버 OAuth</text>
    <text x="340" y="442" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/auth/naver</text>
    <rect x="240.5" y="464.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="340" y="482" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">로그아웃</text>
    <text x="340" y="498" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/logout</text>
  </g>

  <!-- leaves: 상품 -->
  <g id="leaves-product">
    <rect x="460.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="560" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">둘러보기 · 검색 · 내 주변</text>
    <text x="560" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/product/?q=&amp;category=&amp;lat=</text>
    <rect x="460.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="560" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">상품 상세</text>
    <text x="560" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/product/detail?id=</text>
    <rect x="460.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="560" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">🔒 상품 등록</text>
    <text x="560" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/product/form → write</text>
    <rect x="460.5" y="408.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="560" y="426" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">🔒 상품 수정</text>
    <text x="560" y="442" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/product/edit → update</text>
    <rect x="460.5" y="464.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="560" y="482" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">🔒 상품 삭제</text>
    <text x="560" y="498" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/product/delete</text>
  </g>

  <!-- leaves: 주문/결제 -->
  <g id="leaves-order">
    <rect x="680.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="780" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">토스페이먼츠 결제</text>
    <text x="780" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">상세 → 구매하기 (SDK)</text>
    <rect x="680.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="780" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">결제 승인</text>
    <text x="780" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/order/success</text>
    <rect x="680.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="780" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">결제 실패</text>
    <text x="780" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/order/fail</text>
  </g>

  <!-- leaves: 장바구니 -->
  <g id="leaves-cart">
    <rect x="900.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1000" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">장바구니 목록</text>
    <text x="1000" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/cart/</text>
    <rect x="900.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1000" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">담기</text>
    <text x="1000" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/cart/add</text>
    <rect x="900.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1000" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">빼기</text>
    <text x="1000" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/cart/remove</text>
  </g>

  <!-- leaves: 동네생활 -->
  <g id="leaves-board">
    <rect x="1120.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1220" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">글 목록</text>
    <text x="1220" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/board/</text>
    <rect x="1120.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1220" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">글 보기</text>
    <text x="1220" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/board/view?id=</text>
    <rect x="1120.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1220" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">글쓰기</text>
    <text x="1220" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/board/write</text>
  </g>

  <!-- leaves: 마이페이지 -->
  <g id="leaves-my">
    <rect x="1340.5" y="240.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1440" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">🔒 내 프로필</text>
    <text x="1440" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/profile</text>
    <rect x="1340.5" y="296.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1440" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">🔒 프로필 수정</text>
    <text x="1440" y="330" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/edit → update</text>
    <rect x="1340.5" y="352.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1440" y="370" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">회원 탈퇴</text>
    <text x="1440" y="386" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/user/delete</text>
    <rect x="1340.5" y="408.5" width="199" height="43" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1440" y="426" text-anchor="middle" font-size="13" font-weight="500" fill="#000000">에러 페이지</text>
    <text x="1440" y="442" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#a3a3a3">/error (404 · 500)</text>
  </g>

  <!-- legend -->
  <g id="legend">
    <text x="24" y="576" font-size="12" fill="#737373">🔒 로그인 필요 (LoginCheckFilter 보호 — web.xml 기준)</text>
    <text x="24" y="596" font-size="12" fill="#a3a3a3">실선 = 구조(소속) · 회색 모노 = 실제 URL 매핑 (@WebServlet 기준)</text>
  </g>
</svg>
