<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect id="frame" x="0.5" y="0.5" width="389" height="843" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- topbar (뒤로) -->
  <g id="topbar">
    <line x1="1" y1="56.5" x2="389" y2="56.5" stroke="#e5e5e5"/>
    <path d="M34 20l-8 8 8 8" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 상품 사진 (스와이프 갤러리) -->
  <g id="product-image">
    <rect x="1" y="57" width="388" height="320" fill="#fafafa"/>
    <line x1="1" y1="57" x2="389" y2="377" stroke="#e5e5e5"/>
    <line x1="389" y1="57" x2="1" y2="377" stroke="#e5e5e5"/>
    <circle cx="183" cy="363" r="3" fill="#525252"/>
    <circle cx="195" cy="363" r="3" fill="#d4d4d4"/>
    <circle cx="207" cy="363" r="3" fill="#d4d4d4"/>
  </g>

  <!-- 상품 정보 -->
  <g id="content">
    <text x="24" y="412" font-size="14" fill="#737373">민호 · 서울 · 매너온도 36.5℃</text>
    <text x="24" y="444" font-family="'SF Pro Rounded', system-ui, sans-serif" font-size="24" font-weight="600" fill="#000000">아이폰 15</text>
    <text x="24" y="488" font-family="'SF Pro Rounded', system-ui, sans-serif" font-size="30" font-weight="500" fill="#000000">800,000원</text>
    <text x="24" y="516" font-size="14" fill="#525252">판매중 · 조회 13 · 관심 2</text>
    <line x1="24" y1="540" x2="366" y2="540" stroke="#e5e5e5"/>
    <text x="24" y="572" font-size="16" fill="#525252">거의 새 제품입니다. 풀박스 구성이고</text>
    <text x="24" y="596" font-size="16" fill="#525252">직거래는 서울 강남 인근에서 가능합니다.</text>
  </g>

  <!-- 하단 액션바 -->
  <g id="action-bar">
    <line x1="1" y1="764.5" x2="389" y2="764.5" stroke="#e5e5e5"/>
    <rect x="24.5" y="780.5" width="109" height="47" rx="23.5" fill="#ffffff" stroke="#d4d4d4"/>
    <text x="79" y="809" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">장바구니</text>
    <rect x="142" y="780" width="224" height="48" rx="24" fill="#000000"/>
    <text x="254" y="809" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">구매하기</text>
  </g>
</svg>
