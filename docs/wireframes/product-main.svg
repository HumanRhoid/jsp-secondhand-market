  </g>

  <!-- 카테고리 칩 -->
  <g id="cat-chips" font-size="13" font-weight="500">
    <rect x="24" y="72" width="48" height="32" rx="16" fill="#000000"/>
    <text x="48" y="92" text-anchor="middle" fill="#ffffff">전체</text>
    <rect x="80.5" y="72.5" width="84" height="31" rx="15.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="122" y="92" text-anchor="middle" fill="#525252">📍 내 주변</text>
    <rect x="172.5" y="72.5" width="52" height="31" rx="15.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="198" y="92" text-anchor="middle" fill="#525252">도서</text>
    <rect x="232.5" y="72.5" width="110" height="31" rx="15.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="287" y="92" text-anchor="middle" fill="#525252">가구/인테리어</text>
    <rect x="350.5" y="72.5" width="52" height="31" rx="15.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="376" y="92" text-anchor="middle" fill="#525252">기타</text>
