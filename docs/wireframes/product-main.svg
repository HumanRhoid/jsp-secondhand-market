  <!-- 인기 매물 (Redis TOP 4) -->
  <g id="popular">
    <text x="24" y="135" font-family="'SF Pro Rounded', system-ui, sans-serif" font-size="15" font-weight="600" fill="#000000">지금 인기</text>
    <g font-size="12">
      <rect x="24.5" y="144.5" width="77" height="49" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <text x="33" y="163" fill="#000000" font-weight="500">아이폰 15</text>
      <text x="33" y="180" fill="#000000" font-weight="700">800,000원</text>
      <rect x="112.5" y="144.5" width="77" height="49" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <text x="121" y="163" fill="#000000" font-weight="500">맥북 프로</text>
      <text x="121" y="180" fill="#000000" font-weight="700">1,500,000…</text>
      <rect x="200.5" y="144.5" width="77" height="49" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <text x="209" y="163" fill="#000000" font-weight="500">캠핑 의자</text>
      <text x="209" y="180" fill="#000000" font-weight="700">25,000원</text>
      <rect x="288.5" y="144.5" width="77" height="49" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <text x="297" y="163" fill="#000000" font-weight="500">스탠드 조명</text>
      <text x="297" y="180" fill="#000000" font-weight="700">18,000원</text>
    </g>
  </g>

