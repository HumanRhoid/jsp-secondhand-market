      <path d="M287 19h3l2.4 11a1.8 1.8 0 0 0 1.8 1.4h7.6a1.8 1.8 0 0 0 1.8-1.4l1.8-7h-15"/>
    </g>
    <g id="icon-profile" stroke="#525252" stroke-width="1.8" fill="none">
