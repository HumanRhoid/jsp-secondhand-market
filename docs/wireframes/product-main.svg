<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect id="frame" x="0.5" y="0.5" width="389" height="843" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- topbar: 검색 pill + 동네생활/장바구니/프로필 -->
  <g id="topbar">
    <line x1="1" y1="56.5" x2="389" y2="56.5" stroke="#e5e5e5"/>
    <rect x="16" y="10" width="214" height="36" rx="18" fill="#fafafa"/>
    <g stroke="#737373" stroke-width="1.8" fill="none">
      <circle cx="33" cy="27" r="5.5"/>
      <line x1="37.5" y1="31.5" x2="42" y2="36"/>
    </g>
    <text x="50" y="33" font-size="14" fill="#a3a3a3">찾는 물건을 검색하세요</text>
    <g id="icon-board" stroke="#525252" stroke-width="1.8" fill="none">
      <path d="M260 21h-16a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10l4 4v-4h2a2 2 0 0 0 2-2V23a2 2 0 0 0-2-2z"/>
    </g>
    <g id="icon-cart" stroke="#525252" stroke-width="1.8" fill="none">
