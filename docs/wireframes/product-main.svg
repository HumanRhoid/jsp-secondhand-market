      <line x1="24.5" y1="218.5" x2="186.5" y2="380.5" stroke="#e5e5e5"/>
      <line x1="186.5" y1="218.5" x2="24.5" y2="380.5" stroke="#e5e5e5"/>
      <text x="28" y="405" font-size="16" font-weight="500" fill="#000000">아이폰 15</text>
      <text x="28" y="426" font-size="15" font-weight="700" fill="#000000">800,000원</text>
      <text x="28" y="446" font-size="14" fill="#737373">거의 새 제품입니다</text>
    </g>
    <!-- card 2 -->
    <g id="card-2">
      <rect x="203.5" y="218.5" width="162" height="162" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <line x1="203.5" y1="218.5" x2="365.5" y2="380.5" stroke="#e5e5e5"/>
      <line x1="365.5" y1="218.5" x2="203.5" y2="380.5" stroke="#e5e5e5"/>
      <text x="207" y="405" font-size="16" font-weight="500" fill="#000000">맥북 프로 14</text>
      <text x="207" y="426" font-size="15" font-weight="700" fill="#000000">1,500,000원</text>
      <text x="207" y="446" font-size="14" fill="#737373">애플케어 포함</text>
      <text x="207" y="466" font-size="12" font-weight="500" fill="#525252">예약중</text>
    </g>
    <!-- card 3 -->
    <g id="card-3">
      <rect x="24.5" y="500.5" width="162" height="162" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <line x1="24.5" y1="500.5" x2="186.5" y2="662.5" stroke="#e5e5e5"/>
      <line x1="186.5" y1="500.5" x2="24.5" y2="662.5" stroke="#e5e5e5"/>
      <text x="28" y="687" font-size="16" font-weight="500" fill="#000000">캠핑 의자</text>
      <text x="28" y="708" font-size="15" font-weight="700" fill="#000000">25,000원</text>
      <text x="28" y="728" font-size="14" fill="#737373">두 개 일괄 판매</text>
    </g>
    <!-- card 4 -->
    <g id="card-4">
      <rect x="203.5" y="500.5" width="162" height="162" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
      <line x1="203.5" y1="500.5" x2="365.5" y2="662.5" stroke="#e5e5e5"/>
      <line x1="365.5" y1="500.5" x2="203.5" y2="662.5" stroke="#e5e5e5"/>
      <text x="207" y="687" font-size="16" font-weight="500" fill="#000000">스탠드 조명</text>
      <text x="207" y="708" font-size="15" font-weight="700" fill="#000000">18,000원</text>
      <text x="207" y="728" font-size="14" fill="#737373">사용감 적음</text>
    </g>
  </g>

  <!-- 판매하기 FAB -->
  <g id="fab">
    <circle cx="350" cy="784" r="28" fill="#000000"/>
    <line x1="350" y1="772" x2="350" y2="796" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="338" y1="784" x2="362" y2="784" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
