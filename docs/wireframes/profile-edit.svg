<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect id="frame" x="0.5" y="0.5" width="389" height="843" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- topbar -->
  <g id="topbar">
    <line x1="1" y1="56.5" x2="389" y2="56.5" stroke="#e5e5e5"/>
    <path d="M34 20l-8 8 8 8" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="195" y="33" text-anchor="middle" font-size="16" font-weight="500" fill="#000000">프로필 수정</text>
  </g>

  <!-- 아바타 -->
  <g id="avatar">
    <circle cx="195" cy="132" r="47.5" fill="#fafafa" stroke="#e5e5e5"/>
    <g stroke="#d4d4d4" stroke-width="2" fill="none">
      <circle cx="195" cy="120" r="14"/>
      <path d="M167 164c4-14 14-20 28-20s24 6 28 20"/>
    </g>
  </g>

  <!-- 이메일 (disabled) -->
  <g id="field-email">
    <text x="32" y="208" font-size="14" font-weight="500" fill="#000000">이메일</text>
    <rect x="24.5" y="224.5" width="341" height="43" rx="21.5" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="40" y="251" font-size="16" fill="#a3a3a3">test@test.com</text>
    <text x="32" y="286" font-size="12" fill="#a3a3a3">이메일은 변경할 수 없어요</text>
  </g>

  <!-- 닉네임 -->
  <g id="field-nickname">
    <text x="32" y="314" font-size="14" font-weight="500" fill="#000000">닉네임</text>
    <rect x="24.5" y="330.5" width="341" height="43" rx="21.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="40" y="357" font-size="16" fill="#000000">민호</text>
  </g>

  <!-- 지역 (select) -->
  <g id="field-region">
    <text x="32" y="402" font-size="14" font-weight="500" fill="#000000">지역</text>
    <rect x="24.5" y="418.5" width="341" height="43" rx="21.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="40" y="445" font-size="16" fill="#000000">서울</text>
    <path d="M344 436l6 6 6-6" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 프로필 이미지 URL -->
  <g id="field-image">
    <text x="32" y="490" font-size="14" font-weight="500" fill="#000000">프로필 이미지 URL</text>
    <rect x="24.5" y="506.5" width="341" height="43" rx="21.5" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="40" y="533" font-size="16" fill="#a3a3a3">https://...</text>
    <text x="32" y="568" font-size="12" fill="#a3a3a3">이미지 주소를 입력하면 프로필 사진이 바뀝니다</text>
  </g>

  <!-- 하단 저장 버튼 -->
  <g id="action-bar">
    <line x1="1" y1="764.5" x2="389" y2="764.5" stroke="#e5e5e5"/>
    <rect x="24" y="780" width="342" height="48" rx="24" fill="#000000"/>
    <text x="195" y="809" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">저장</text>
  </g>
</svg>
